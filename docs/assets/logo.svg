<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- Mosaic tile grid: 5x5 with 2px gap, offset 56px, tile size 78px -->
  <!-- Row 0 -->
  <rect x="56"  y="56"  width="78" height="78" rx="6" fill="#1e293b" opacity="0.5"/>
  <rect x="136" y="56"  width="78" height="78" rx="6" fill="#06b6d4"/>
  <rect x="216" y="56"  width="78" height="78" rx="6" fill="#8b5cf6" opacity="0.7"/>
  <rect x="296" y="56"  width="78" height="78" rx="6" fill="#1e293b" opacity="0.3"/>
  <rect x="376" y="56"  width="78" height="78" rx="6" fill="#10b981"/>

  <!-- Row 1 -->
  <rect x="56"  y="136" width="78" height="78" rx="6" fill="#f59e0b"/>
  <rect x="136" y="136" width="78" height="78" rx="6" fill="#1e293b" opacity="0.4"/>
  <rect x="216" y="136" width="78" height="78" rx="6" fill="#06b6d4" opacity="0.8"/>
  <rect x="296" y="136" width="78" height="78" rx="6" fill="#ec4899"/>
  <rect x="376" y="136" width="78" height="78" rx="6" fill="#1e293b" opacity="0.5"/>

  <!-- Row 2 -->
  <rect x="56"  y="216" width="78" height="78" rx="6" fill="#8b5cf6"/>
  <rect x="136" y="216" width="78" height="78" rx="6" fill="#10b981" opacity="0.9"/>
  <rect x="216" y="216" width="78" height="78" rx="6" fill="#f59e0b"/>
  <rect x="296" y="216" width="78" height="78" rx="6" fill="#06b6d4"/>
  <rect x="376" y="216" width="78" height="78" rx="6" fill="#8b5cf6" opacity="0.6"/>

  <!-- Row 3 -->
  <rect x="56"  y="296" width="78" height="78" rx="6" fill="#1e293b" opacity="0.3"/>
  <rect x="136" y="296" width="78" height="78" rx="6" fill="#ec4899" opacity="0.8"/>
  <rect x="216" y="296" width="78" height="78" rx="6" fill="#1e293b" opacity="0.5"/>
  <rect x="296" y="296" width="78" height="78" rx="6" fill="#10b981"/>
  <rect x="376" y="296" width="78" height="78" rx="6" fill="#f59e0b" opacity="0.9"/>

  <!-- Row 4 -->
  <rect x="56"  y="376" width="78" height="78" rx="6" fill="#06b6d4" opacity="0.7"/>
  <rect x="136" y="376" width="78" height="78" rx="6" fill="#1e293b" opacity="0.4"/>
  <rect x="216" y="376" width="78" height="78" rx="6" fill="#8b5cf6"/>
  <rect x="296" y="376" width="78" height="78" rx="6" fill="#1e293b" opacity="0.3"/>
  <rect x="376" y="376" width="78" height="78" rx="6" fill="#06b6d4"/>

  <!-- Terminal cursor accent on center tile -->
  <rect x="226" y="240" width="10" height="46" rx="2" fill="#f8fafc" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
