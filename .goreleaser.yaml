# .goreleaser.yaml
#
# goreleaser configuration for mosaic. Triggered by `git push --tags`
# via the release GitHub Action; runs locally with `goreleaser
# release --snapshot --clean` to dry-run the pipeline.
#
# Cross-platform archives (darwin + linux, arm64 + amd64) attached
# to GitHub Releases.
version: 2

project_name: mosaic

before:
  hooks:
    - go mod tidy

builds:
  - id: mosaic
    main: ./cmd/mosaic
    binary: mosaic
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

brews:
  - repository:
      owner: Mizune
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Mizune/mosaic"
    description: "TUI command center for running 10+ AI coding agents in parallel"
    license: "MIT"
    post_install: |
      system "xattr", "-cr", bin/"mosaic"
    test: |
      system "#{bin}/mosaic", "--version"

release:
  github:
    owner: Mizune
    name: mosaic
  draft: false
  prerelease: auto
  name_template: "mosaic {{.Version}}"
